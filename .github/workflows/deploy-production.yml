name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: [self-hosted, production]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node is preinstalled on the self-hosted production runner.
      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: |
          # Do not pass an empty VITE_API_BASE_URL into the process —
          # Vite would treat it as set and ignore .env.production.
          # Optional GitHub Environment var can override the committed file.
          if [ -n "${GITHUB_VITE_API_BASE_URL}" ]; then
            export VITE_API_BASE_URL="${GITHUB_VITE_API_BASE_URL}"
            echo "Using VITE_API_BASE_URL from GitHub Environment"
          else
            unset VITE_API_BASE_URL
            echo "Using VITE_API_BASE_URL from .env.production"
          fi
          unset VITE_APP_BASE
          npm run build:production
        env:
          GITHUB_VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Deploy production build
        run: |
          DEPLOY_DIR="${DEPLOY_DIR:-/var/www/html/chalochuttihotel}"
          case "${DEPLOY_DIR}" in
            */) DEPLOY_DIR="${DEPLOY_DIR%/}" ;;
          esac
          case "${DEPLOY_DIR}" in
            */chalochutti)
              echo "Production DEPLOY_DIR must not be the staging path: ${DEPLOY_DIR}"
              exit 1
              ;;
          esac
          echo "Deploying production to ${DEPLOY_DIR}"
          mkdir -p "${DEPLOY_DIR}"
          if [ ! -d dist ]; then
            echo "Build folder 'dist' not found"
            exit 1
          fi
          # App base is `/` — copy build contents (do not use -a; runner
          # cannot preserve timestamps on www-owned deploy dirs).
          rm -rf "${DEPLOY_DIR}/assets"
          rm -f "${DEPLOY_DIR}/index.html"
          cp -r dist/. "${DEPLOY_DIR}/"
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
